<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico">
<title>Fraction times a whole number</title>
<style>
  body { margin: 0; padding: 1.5rem; font-family: system-ui, sans-serif; color: #222; background: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 1rem; }
  .toggle { display: inline-flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; margin-bottom: 1.25rem; }
  .toggle button { font: inherit; font-size: 15px; padding: 8px 16px; border: 0; background: #fff; color: #555; cursor: pointer; }
  .toggle button + button { border-left: 1px solid #ccc; }
  .toggle button[aria-pressed="true"] { background: #BA7517; color: #fff; font-weight: 600; }
  .toggle button:focus-visible { outline: 2px solid #378ADD; outline-offset: -2px; }
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 1.25rem; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { color: #666; font-size: 13px; }
  .field input { width: 4.5rem; font: inherit; font-size: 18px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; }
  .field input:focus { outline: 2px solid #378ADD; outline-offset: 1px; }
  .fracin { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .fracin hr { width: 100%; border: 0; border-top: 2px solid #222; margin: 0; }
  .times { font-size: 22px; color: #666; padding-bottom: 28px; }
  .eq { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 22px; background: #f3f3f1; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-variant-numeric: tabular-nums; }
  .eq .ans { display: inline-flex; align-items: center; gap: 6px; color: #BA7517; font-weight: 600; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .frac span:first-child { border-bottom: 2px solid currentColor; padding: 0 3px; }
  .frac span:last-child { padding: 0 3px; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 560px; height: auto; font-variant-numeric: tabular-nums; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 15px; color: #444; padding-bottom: 30px; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: #BA7517; }
  .note { font-size: 14px; color: #555; line-height: 1.5; max-width: 65ch; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fraction times a whole number</h1>
  <div class="toggle" role="group" aria-label="View">
    <button type="button" id="modeOf" aria-pressed="true"></button>
    <button type="button" id="modeSets" aria-pressed="false"></button>
  </div>
  <div class="controls">
    <div class="field">
      <label>Fraction</label>
      <div class="fracin">
        <input type="number" id="num" min="0" max="12" value="1" aria-label="Numerator">
        <hr>
        <input type="number" id="den" min="1" max="12" value="4" aria-label="Denominator">
      </div>
    </div>
    <div class="times">×</div>
    <div class="field" style="padding-bottom: 22px">
      <label for="whole" id="wholeLabel">Whole number</label>
      <input type="number" id="whole" min="1" max="20" value="9">
    </div>
    <label class="check"><input type="checkbox" id="showDec"> Show decimals</label>
  </div>
  <div class="eq" id="eq"></div>
  <div class="scroll"><svg id="cv" role="img" aria-label="Tape diagram and number line"></svg></div>
  <p class="note" id="note"></p>
</div>
<script>
const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
const ACC = '#BA7517', ACC_FILL = '#F5E3C6', LINE = '#222', MUTED = '#888780';
let mode = location.hash === '#sets' ? 'sets' : 'of';
// Decimals start on for "1/4 of 9" and off for "9 sets of 1/4"; each view remembers its own setting
const decByMode = { of: true, sets: false };

function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function dec(n, d) {
  const v = n / d, r = Math.round(v * 1000) / 1000;
  return (Math.abs(v - r) > 1e-9 ? '≈ ' : '') + r;
}
const showDec = () => decByMode[mode];
// "9/4", or "9/4 = 2.25" when decimals are on
const val = (top, d) => `${top}/${d}` + (showDec() ? ` = ${dec(top, d)}` : '');
function fracHTML(n, d) { return `<span class="frac"><span>${n}</span><span>${d}</span></span>`; }
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function clamp(input, lo, hi) {
  let v = Math.round(+input.value);
  if (!isFinite(v)) v = lo;
  return Math.min(hi, Math.max(lo, v));
}
// Everything after the first "=": top/d, simplified, mixed number, decimal; the last one is the answer
function eqTail(top, d) {
  const g = gcd(top, d) || 1, parts = [fracHTML(top, d)];
  if (g > 1 && d / g !== 1) parts.push(fracHTML(top / g, d / g));
  if (top % d === 0) parts.push(String(top / d));
  else {
    const whole = Math.floor(top / d), rem = top % d, gr = gcd(rem, d);
    if (whole > 0) parts.push(`${whole} ${fracHTML(rem / gr, d / gr)}`);
    if (showDec()) parts.push(dec(top, d));
  }
  parts[parts.length - 1] = `<span class="ans">${parts[parts.length - 1]}</span>`;
  return parts.map(p => ` = ${p}`).join('');
}
// Stacked fraction centered at x (numerator baseline at y), decimal below it when turned on
function stackLabel(svg, x, y, top, d, hit) {
  const c = hit ? ACC : LINE, wt = hit ? 700 : 400, hw = Math.max(10, String(top).length * 5 + 3);
  svg.append(el('text', { x, y, 'text-anchor': 'middle', 'font-size': 15, fill: c, 'font-weight': wt }, top));
  svg.append(el('line', { x1: x - hw, x2: x + hw, y1: y + 5, y2: y + 5, stroke: c, 'stroke-width': 1.5 }));
  svg.append(el('text', { x, y: y + 21, 'text-anchor': 'middle', 'font-size': 15, fill: c, 'font-weight': wt }, d));
  if (showDec()) svg.append(el('text', { x, y: y + 42, 'text-anchor': 'middle', 'font-size': 13, fill: hit ? ACC : '#666', 'font-weight': wt }, dec(top, d)));
}
function blockFrac(svg, cx, y, n, d, c) {
  svg.append(el('text', { x: cx, y: y + 19, 'text-anchor': 'middle', 'font-size': 14, fill: c }, n));
  svg.append(el('line', { x1: cx - 8, x2: cx + 8, y1: y + 23, y2: y + 23, stroke: c, 'stroke-width': 1.5 }));
  svg.append(el('text', { x: cx, y: y + 38, 'text-anchor': 'middle', 'font-size': 14, fill: c }, d));
}
function numberLine(svg, X, max, yl, end, d) {
  svg.append(el('line', { x1: X(0), x2: X(max), y1: yl, y2: yl, stroke: LINE, 'stroke-width': 2 }));
  if (end > 0) svg.append(el('line', { x1: X(0), x2: X(end), y1: yl, y2: yl, stroke: ACC, 'stroke-width': 6, 'stroke-linecap': 'round' }));
  if (d) for (let j = 1; j < max * d; j++) if (j % d) {
    svg.append(el('line', { x1: X(j / d), x2: X(j / d), y1: yl - 4, y2: yl + 4, stroke: '#bbb' }));
  }
  for (let i = 0; i <= max; i++) {
    svg.append(el('line', { x1: X(i), x2: X(i), y1: yl - 6, y2: yl + 6, stroke: MUTED }));
    svg.append(el('text', { x: X(i), y: yl - 12, 'text-anchor': 'middle', 'font-size': 12, fill: MUTED }, i));
  }
}

const W = 900, L = 40, R = W - 40, bh = 44;
const labelsHeight = () => showDec() ? 85 : 65;

// "1/4 of 9": split the whole number into d equal parts, take n of them
function drawOf(svg, n, d, w) {
  const top = n * w, X = v => L + (R - L) * v / w, pw = w / d, y1 = 30, y2 = 110, yl = 215;
  $('eq').innerHTML = `${fracHTML(n, d)} × ${w}` + eqTail(top, d);
  $('note').textContent = `Split ${w} into ${d} equal part${d > 1 ? 's' : ''}. Each part is ${val(w, d)}. ` +
    `Taking ${n} of those parts lands at ${val(top, d)} on the number line.`;

  svg.append(el('text', { x: L, y: y1 - 10, 'font-size': 13, fill: '#666' }, `${w} whole${w > 1 ? 's' : ''}`));
  for (let i = 0; i < w; i++) {
    svg.append(el('rect', { x: X(i), y: y1, width: X(1) - X(0), height: bh, fill: '#f3f3f1', stroke: '#bbb' }));
    svg.append(el('text', { x: (X(i) + X(i + 1)) / 2, y: y1 + bh / 2 + 5, 'text-anchor': 'middle', 'font-size': 15, fill: '#555' }, '1'));
  }

  svg.append(el('text', { x: L, y: y2 - 10, 'font-size': 13, fill: '#666' }, `Split into ${d} equal part${d > 1 ? 's' : ''}`));
  for (let k = 0; k < d; k++) {
    const on = k < n;
    svg.append(el('rect', { x: X(k * pw), y: y2, width: X(pw) - X(0), height: bh, fill: on ? ACC_FILL : '#fff', stroke: on ? ACC : '#bbb', 'stroke-width': on ? 1.5 : 1 }));
    blockFrac(svg, X((k + 0.5) * pw), y2, 1, d, on ? ACC : '#555');
  }
  for (let k = 0; k <= d; k++) {
    svg.append(el('line', { x1: X(k * pw), x2: X(k * pw), y1: y2 + bh, y2: yl - 28, stroke: k === n ? ACC : '#ccc', 'stroke-dasharray': '3 4' }));
  }

  numberLine(svg, X, w, yl, n * pw, 0);
  for (let k = 0; k <= d; k++) {
    const x = X(k * pw), hit = k === n;
    svg.append(el('line', { x1: x, x2: x, y1: yl - 10, y2: yl + 10, stroke: hit ? ACC : LINE, 'stroke-width': 2 }));
    stackLabel(svg, x, yl + 30, k * w, d, hit);
  }
  svg.append(el('circle', { cx: X(n * pw), cy: yl, r: 7, fill: ACC, stroke: '#fff', 'stroke-width': 2 }));
  return yl + labelsHeight();
}

// "9 sets of 1/4": w separate fraction bars, each with n of d parts colored in, counted as we go
function drawSets(svg, n, d, w) {
  const top = n * w, rows = Math.ceil(w / 5), cols = Math.ceil(w / rows), gap = 24;
  const cw = (R - L - (cols - 1) * gap) / cols, bw = Math.min(cw, 200), rowH = showDec() ? 132 : 112, y0 = 30;
  $('eq').innerHTML = `${w} × ${fracHTML(n, d)}` + eqTail(top, d);
  $('note').textContent = `Each bar is split into ${d} equal part${d > 1 ? 's' : ''} with ${n} colored in, so each bar shows ${n}/${d}. ` +
    `Count the colored parts bar by bar: ${Array.from({ length: Math.min(w, 4) }, (_, k) => `${(k + 1) * n}/${d}`).join(', ')}${w > 4 ? ', and so on' : ''}. ` +
    `${w} set${w > 1 ? 's' : ''} of ${n}/${d} make ${val(top, d)}.`;

  svg.append(el('text', { x: L, y: y0 - 10, 'font-size': 13, fill: '#666' }, `${w} set${w > 1 ? 's' : ''} of ${n}/${d}`));
  for (let k = 0; k < w; k++) {
    const r = Math.floor(k / cols), c = k % cols, last = k === w - 1;
    const x0 = L + c * (cw + gap) + (cw - bw) / 2, y = y0 + r * rowH, sw = bw / d;
    for (let j = 0; j < d; j++) {
      const on = j < n;
      svg.append(el('rect', { x: x0 + j * sw, y, width: sw, height: bh, fill: on ? ACC_FILL : '#fff', stroke: on ? ACC : '#bbb', 'stroke-width': on ? 1.5 : 1 }));
    }
    // Running count of the colored parts so far
    stackLabel(svg, x0 + bw / 2, y + bh + 22, (k + 1) * n, d, last);
  }

  // Number line: where each count lands
  const yl = y0 + rows * rowH + 40, max = Math.max(1, Math.ceil(top / d)), X = v => L + (R - L) * v / max;
  const step = n > 0 ? Math.ceil(40 / (X(n / d) - X(0))) : w + 1;
  numberLine(svg, X, max, yl, top / d, d);
  for (let k = 0; k <= w; k++) {
    const x = X(k * n / d), hit = k === w;
    svg.append(el('line', { x1: x, x2: x, y1: yl - 10, y2: yl + 10, stroke: hit ? ACC : LINE, 'stroke-width': 2 }));
    if ((w - k) % step === 0) stackLabel(svg, x, yl + 30, k * n, d, hit);
  }
  svg.append(el('circle', { cx: X(top / d), cy: yl, r: 7, fill: ACC, stroke: '#fff', 'stroke-width': 2 }));
  return yl + labelsHeight();
}

function draw() {
  const d = clamp($('den'), 1, 12), n = clamp($('num'), 0, d), w = clamp($('whole'), 1, 20);
  $('modeOf').textContent = `${n}/${d} of ${w}`;
  $('modeSets').textContent = `${w} sets of ${n}/${d}`;
  $('modeOf').setAttribute('aria-pressed', mode === 'of');
  $('modeSets').setAttribute('aria-pressed', mode === 'sets');
  $('showDec').checked = decByMode[mode];
  $('wholeLabel').textContent = mode === 'of' ? 'Whole number' : 'Number of sets';

  const svg = $('cv');
  svg.replaceChildren();
  const H = (mode === 'of' ? drawOf : drawSets)(svg, n, d, w);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
}

$('modeOf').addEventListener('click', () => { mode = 'of'; draw(); });
$('modeSets').addEventListener('click', () => { mode = 'sets'; draw(); });
$('showDec').addEventListener('input', () => { decByMode[mode] = $('showDec').checked; draw(); });
['num', 'den', 'whole'].forEach(id => $(id).addEventListener('input', draw));
draw();
</script>
</body>
</html>
